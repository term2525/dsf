<!-- Q.1) Using node js create an eLearning System -->
<!DOCTYPE html>
<html>
<head>
  <title>eLearning System</title>
  <style>
    .split { height: 100%; width: 50%; position: fixed; top: 0; }
    .left { left: 0; background-color: #f1f1f1; }
    .right { right: 0; }
    .centered { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; }
  </style>
</head>
<body>
  <h1>eLearning System</h1>
  <div class="split left">
    <div class="centered">
      <h1>
        <a href="/html_tutorial" target="a">HTML</a><br>
        <a href="/nodejs_tutorial" target="a">Node JS</a><br>
        <a href="/javascript_tutorial" target="a">Javascript</a>
      </h1>
    </div>
  </div>
  <div class="split right">
    <iframe name="a" height="100%" width="100%"></iframe>
  </div>
</body>
</html>
